name: Validacao dos 22 itens POO

on:
  push:
    branches: [feature/adequacao-22-itens-poo]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compilar, testar e gerar o JAR
        run: mvn -B -ntp verify
