name: Validação dos 22 itens POO

on:
  push:
    branches: [feature/adequacao-22-itens-poo]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compilar, executar testes POO e gerar JAR
        run: mvn -B -ntp verify
      - name: Instalar Graphviz para validar a documentação
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Verificar índice, diagrama PDF e pacote ZIP
        run: |
          python3 scripts/gerar-entrega.py Equipe_Teste
          test -s dist/Equipe_Teste.zip
          unzip -l dist/Equipe_Teste.zip | grep -q 'documentacao/diagrama-classes.pdf'
          unzip -l dist/Equipe_Teste.zip | grep -q 'docs/indice-22-itens-poo.md'
