name: Compilação e cenários POO

on:
  push:
    branches: [feature/adequacao-22-itens-poo]
  pull_request:
    branches: [main]

jobs:
  java26:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compilar classes e verificações
        run: mvn -B -ntp test-compile
      - name: Verificar combate
        run: mvn -B -ntp org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.classpathScope=test -Dexec.mainClass=com.alemdoequilibrio.game.CombatScenarioChecks
      - name: Verificar persistência e requisitos POO
        run: mvn -B -ntp org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.classpathScope=test -Dexec.mainClass=com.alemdoequilibrio.game.PersistenceScenarioChecks
